name: quickshop_final
description: QuickShop E-Commerce Flutter app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.3
  cloud_firestore: ^4.9.7
  firebase_storage: ^11.5.7  # ✅ Already correct version

  # Authentication
  google_sign_in: ^6.1.1

  # UI & Animation
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  carousel_slider: ^5.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^1.1.0
  lottie: ^2.7.0
  intl: ^0.18.1
  image_picker: ^1.1.0  # ✅ Already added for PC/Camera image selection

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
   #- assets/images/
   #- assets/animations/